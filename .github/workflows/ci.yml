name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  app:
    name: App (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  postcode-loader:
    name: Postcode loader (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data/postcode-loader
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo test --release
